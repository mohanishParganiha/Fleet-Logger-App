services:

  web:
    build: .
    image: ${IMAGE_PATH}
    command: gunicorn config.wsgi:application -c gunicorn_config.py --worker-tmp-dir /dev/shm
    restart: always
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    dns:
      - 169.254.169.254
    dns_search:
      - ${DNS1}
      - ${DNS2}
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CSRF_COOKIE_DOMAIN=${CSRF_COOKIE_DOMAIN}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_LIFETIME=${ACCESS_TOKEN_LIFETIME}
      - REFRESH_TOKEN_LIFETIME=${REFRESH_TOKEN_LIFETIME}
      - ROTATE_REFRESH_TOKENS=${ROTATE_REFRESH_TOKENS}
      - BLACKLIST_AFTER_ROTATION=${BLACKLIST_AFTER_ROTATION}
      - AUTH_COOKIE=${AUTH_COOKIE}
      - AUTH_COOKIE_REFRESH=${AUTH_COOKIE_REFRESH}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
      - AUTH_COOKIE_HTTP_ONLY=${AUTH_COOKIE_HTTP_ONLY}
      - AUTH_COOKIE_PATH=${AUTH_COOKIE_PATH}
      - AUTH_COOKIE_SAMESITE=${AUTH_COOKIE_SAMESITE}

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - fleet_network
    deploy:
      resources:
        limits:
          memory: 600M
        reservations:
          memory: 400M


  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - fleet_network
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  static_volume:

networks:
  fleet_network:
    driver: bridge